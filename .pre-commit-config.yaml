repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies:
          - pydantic>=2.6.0
          - pydantic-settings>=2.2.0
          - fastapi>=0.110.0
          - httpx>=0.27.0
          - pytest>=8.0.0
