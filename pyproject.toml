[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airplan"
version = "0.1.0"
description = "GenAI-assisted household clean-air planner for winter smog"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
    "radon>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort imports
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit security
    "C90", # mccabe complexity
    "D",   # pydocstyle docstrings
    "ANN", # flake8-annotations
    "SIM", # flake8-simplify
    "PL",  # Pylint
    "RUF", # Ruff-specific rules
]
ignore = [
    # ANN401: Dynamically typed expressions (typing.Any) are needed for Starlette/FastAPI middleware call_next handlers
    "ANN401",
    # D105: Missing docstring in magic methods (e.g., __str__, __repr__) which are self-explanatory
    "D105",
    # D107: Missing docstring in __init__ because class-level docstring documents parameters
    "D107",
    # PLR0913: Too many arguments in function definition (domain simulation requires physical boundary parameters)
    "PLR0913",
    # S101: Use of assert detected (needed in pytest test suites)
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    # PLR2004: Numeric constants and literal expectations in test assertions
    "PLR2004",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
fail_under = 90
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
